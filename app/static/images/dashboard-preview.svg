  <text x="560" y="628" font-size="13" fill="#1C7C3A" font-weight="700">+3 999 Kč</text>
  <text x="700" y="628" font-size="13" fill="#1C7C3A" font-weight="700">2,78×</text>
  <rect x="795" y="613" width="68" height="22" rx="11" fill="#E8F5EE"/>
  <text x="829" y="628" font-size="11" fill="#1C7C3A" font-weight="600" text-anchor="middle">ZISKOVÉ</text>
