<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ověření e-mailu — Marketingový přehled</title>
    <link rel="stylesheet" href="/static/styles.css?v=2" />
    <script defer src="/static/common.js"></script>
    <script defer src="/static/verify_email.js"></script>
  </head>
  <body class="auth-page">
    <header class="topbar topbar--auth">
      <div class="topbar__left">
        <a href="/" class="brand brand--link">
          <div class="brand__logo">MA</div>
          <div class="brand__text">
            <div class="brand__title">Marketingový přehled</div>
            <div class="brand__subtitle">Přehled výkonu marketingu</div>
          </div>
        </a>
      </div>
    </header>

    <main class="auth-main">
      <div class="card auth-card">
        <h1 class="auth-card__title">Ověření e-mailu</h1>

        <p id="verifyLoading" class="auth-loading">Ověřuji odkaz…</p>

        <div id="verifySuccess" class="auth-success hidden" role="alert">
          <p>✓ Váš e-mail byl úspěšně ověřen.</p>
          <p class="auth-success__note">Budete přesměrováni na přihlášení…</p>
        </div>

        <div id="verifyError" class="auth-error-banner hidden" role="alert">
          <p id="verifyErrorMsg">Odkaz pro ověření je neplatný nebo vypršel.</p>
          <p><a href="/login">Přihlásit se</a> a požádat o nový ověřovací odkaz.</p>
        </div>
      </div>
    </main>
  </body>
</html>
