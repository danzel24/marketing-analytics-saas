<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <title>Stránka nenalezena — Marketingový přehled</title>
    <link rel="stylesheet" href="/static/styles.css?v=4" />
  </head>
  <body class="auth-page">
    <header class="topbar topbar--auth">
      <div class="topbar__left">
        <a href="/" class="brand brand--link">
          <div class="brand__logo">MA</div>
          <div class="brand__text">
            <div class="brand__title">Marketingový přehled</div>
            <div class="brand__subtitle">Přehled výkonu marketingu</div>
          </div>
        </a>
      </div>
      <nav class="topbar__nav">
        <a class="topbar__nav-link" href="/login">Přihlášení</a>
      </nav>
    </header>
    <main class="auth-main">
      <div class="card auth-card error-page-card">
        <p class="error-page__code">404</p>
        <h1 class="auth-card__title">Stránka nenalezena</h1>
        <p class="error-page__text">Požadovaná adresa neexistuje nebo byla přesunuta.</p>
        <p class="error-page__id" data-request-id="{{ request_id }}">ID požadavku: {{ request_id }}</p>
        <div class="error-page__actions">
          <a class="btn btn--primary" href="/dashboard">Přejít na přehled</a>
        </div>
      </div>
    </main>
  </body>
</html>
