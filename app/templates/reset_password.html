<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <title>Nové heslo — Marketingový přehled</title>
    <link rel="stylesheet" href="/static/styles.css?v=4" />
    <script defer src="/static/common.js"></script>
    <script defer src="/static/reset_password.js"></script>
  </head>
  <body class="auth-page">
    <header class="topbar topbar--auth">
      <div class="topbar__left">
        <a href="/" class="brand brand--link">
          <div class="brand__logo">MA</div>
          <div class="brand__text">
            <div class="brand__title">Marketingový přehled</div>
            <div class="brand__subtitle">Nastavení nového hesla</div>
          </div>
        </a>
      </div>
      <nav class="topbar__nav">
        <a class="topbar__nav-link" href="/login">Přihlášení</a>
        {% include "_feedback_nav_link.html" %}
      </nav>
    </header>

    <main class="auth-main">
      <div class="card login-card auth-card">
        <h1 class="auth-card__title">Nové heslo</h1>
        <p class="login-subtitle">Zadejte nové heslo pro váš účet.</p>

        <div id="resetInvalidToken" class="auth-error-banner hidden" role="alert">
          <p>⚠ Odkaz pro obnovení hesla je neplatný nebo vypršel.</p>
          <p><a href="/forgot-password">Požádat o nový odkaz →</a></p>
        </div>

        <div id="resetForm">
          <div class="login-field">
            <label for="resetPassword">Nové heslo <span class="auth-field-note">(min. 8 znaků)</span></label>
            <input id="resetPassword" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="••••••••" />
          </div>
          <div class="login-field">
            <label for="resetPasswordConfirm">Potvrdit nové heslo</label>
            <input id="resetPasswordConfirm" name="password_confirm" type="password" autocomplete="new-password" required minlength="8" placeholder="••••••••" />
          </div>

          <button id="resetBtn" type="button" class="btn login-btn btn--primary">Nastavit nové heslo</button>
          <p id="resetLoading" class="auth-loading hidden">Ukládám…</p>
          <p id="resetError" class="login-error" role="alert"></p>
        </div>

        <p class="auth-forgot-link"><a href="/login">← Zpět na přihlášení</a></p>
      </div>
    </main>
  </body>
</html>
