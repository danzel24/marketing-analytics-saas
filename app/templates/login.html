<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Přihlášení — Marketingový přehled</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css?v=2" />
    <script defer src="/static/common.js"></script>
    <script defer src="/static/login.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (new URLSearchParams(window.location.search).get("reset") === "1") {
          var el = document.getElementById("loginResetSuccess");
          if (el) el.classList.remove("hidden");
          history.replaceState(null, "", window.location.pathname);
        }
      });
    </script>
  </head>
  <body class="auth-page">
    <header class="topbar topbar--auth">
      <div class="topbar__left">
        <a href="/" class="brand brand--link">
          <div class="brand__logo">MA</div>
          <div class="brand__text">
            <div class="brand__title">Marketingový přehled</div>
            <div class="brand__subtitle">Přehled výkonu marketingu</div>
          </div>
        </a>
      </div>
      <nav class="topbar__nav">
        <a class="topbar__nav-link" href="/register">Registrace</a>
        {% include "_feedback_nav_link.html" %}
      </nav>
    </header>

    <main class="auth-main">
      <div class="card login-card auth-card">
        <h1 class="auth-card__title">Přihlášení</h1>
        <div id="loginResetSuccess" class="auth-success hidden" role="alert">
          <p>✓ Heslo bylo úspěšně změněno. Přihlaste se novým heslem.</p>
        </div>
        <p class="login-subtitle">Zadejte e-mail a heslo pro přístup k přehledu.</p>

        <div class="login-field">
          <label for="loginEmail">E-mail</label>
          <input id="loginEmail" name="email" type="email" autocomplete="username" required placeholder="vas@email.cz" />
        </div>
        <div class="login-field">
          <label for="loginPassword">Heslo</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
        </div>
        <div class="login-field login-field--checkbox">
          <label><input id="loginRemember" type="checkbox" /> Zapamatovat přihlášení (delší relace)</label>
        </div>

        <button id="loginBtn" type="button" class="btn login-btn btn--primary">Přihlásit se</button>
        <p id="loginLoading" class="auth-loading hidden">Přihlašuji…</p>
        <p id="loginError" class="login-error" role="alert"></p>
        <p class="auth-forgot-link"><a href="/forgot-password">Zapomněli jste heslo?</a></p>
      </div>
    </main>
  </body>
</html>
